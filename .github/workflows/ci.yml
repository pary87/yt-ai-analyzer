name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression checks (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Reject committed Git metadata and bytecode
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$|^(HEAD|config|description|index|packed-refs|COMMIT_EDITMSG|ORIG_HEAD|FETCH_HEAD)$|(^|/)(applypatch-msg|commit-msg|fsmonitor-watchman|post-update|pre-[a-z-]+|prepare-commit-msg|push-to-checkout|sendemail-validate|update)\.sample$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These tracked files should not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py tests_manual.py

      - name: Run regression checks
        run: python tests_manual.py

      # Called from another folder with no .venv, the launcher must switch to
      # its own folder and stop with exit code 1 after printing setup steps.
      - name: Check launcher runs from its own folder
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%"
          call "%GITHUB_WORKSPACE%\Run YouTube Analyzer.bat" < NUL
          if not "%ERRORLEVEL%"=="1" (echo Launcher exit code was %ERRORLEVEL%, expected 1 & exit /b 1)
          if /i not "%CD%"=="%GITHUB_WORKSPACE%" (echo Launcher ran in "%CD%", expected "%GITHUB_WORKSPACE%" & exit /b 1)
          echo Launcher switched to "%CD%" and reported the missing .venv.
          exit /b 0
